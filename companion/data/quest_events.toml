# Quest events: what NPCs learn as the player's quests change the world
# (Phase 5 step 3b). The list, its triggers and who knows what were checked by
# MVXK21 on Nov 9, 2026: docs/phase5-3b-events.md. Facts in our own words.
#
# trigger:   when the event has happened, from the plugin's live quest report:
#              "global:KvatchDestroyed"  a global is set (non-zero)
#              "MQ06>=100", "MQ16<10"    a quest's current stage
#              "MQ11:done:40"            a stage done
#              "Dark09:completed"        a quest completed
#            joined with " and ". `ended`: the same, for when it stops being news.
# who_first: who knows at once: "locals:<place>" (the NPC's location contains
#            it), "faction:<name>", "class:<name>", or "everyone".
#            Everyone else hears after `spread_days` (3, MVXK21), unless only = true.
# about_player: the fact is about the traveller (a title NPCs recognise).
# hides_fact: a fixed world fact (setting_vanilla.toml) this replaces, by a
#            phrase in it, for NPCs who know of the event.

spread_days = 3

# ---- the main quest ------------------------------------------------------------

[[event]]
id = "M1-kvatch-destroyed"
trigger = "global:KvatchDestroyed"
fact = "Kvatch has been destroyed. Daedra came out of Oblivion Gates outside its walls one night and burned the city; only a few survivors escaped, and they're camped on the road below it."
who_first = ["locals:Kvatch", "locals:Skingrad", "locals:Anvil", "faction:Imperial Legion", "faction:Blades", "class:Guard"]

[[event]]
id = "M2-hero-of-kvatch"
trigger = "MS48>=90"
fact = "A stranger went into the Oblivion Gate at Kvatch and closed it, saving the survivors; people call them the Hero of Kvatch."
who_first = ["locals:Kvatch", "faction:Imperial Legion", "class:Guard"]

[[event]]
id = "M2-hero-of-kvatch-is-you"
trigger = "MS48>=90"
fact = "You recognise the traveller in front of you: this is the Hero of Kvatch, who closed the Oblivion Gate there."
who_first = ["locals:Kvatch"]
about_player = true

[[event]]
id = "M3-kvatch-retaken"
trigger = "MS49:completed"
fact = "Kvatch's castle has been taken back from the Daedra. Savlian Matius now leads the survivors, and they mean to rebuild."
who_first = ["locals:Kvatch", "faction:Imperial Legion"]

[[event]]
id = "M4-talk-of-gates"
trigger = "MQ03:completed"
ended = "MQ06:completed"
fact = "There's talk of more Oblivion Gates opening across Cyrodiil, like the one at Kvatch, though most folk hope it's only rumour."
who_first = ["everyone"]

[[event]]
id = "M5-mythic-dawn"
trigger = "MQ05:completed"

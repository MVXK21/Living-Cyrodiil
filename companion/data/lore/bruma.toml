[[entry]]
id = "bruma-guilds"
text = "Bruma has halls of the Fighters Guild and the Mages Guild; the Mages Guild hall is led by the Breton Jeanne Frasoric, who is said to run it carelessly. The Great Chapel of Talos, the youngest of the Nine and the founder of the Empire, is the town's temple."
keywords = ["guild", "guilds", "fighters guild", "mages guild", "jeanne", "frasoric", "mage", "mages", "chapel", "temple", "talos", "priest", "heal", "healing", "pray"]
known_by = "locals:Bruma"
depth = "common"

[[entry]]
id = "bruma-nords"
text = "Many of Bruma's Nords keep the old ways of Skyrim: they drink hard, trust plain speech and steel more than politics, and some still honour the old Nordic gods alongside the Nine."

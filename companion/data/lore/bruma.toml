[[entry]]
id = "bruma-shops"
text = "For trade in Bruma: Hammer and Axe, Fjotreid's smithy; Nord Winds, where Olfand forges arms and armour and Skjorta sells clothes; and Novaroma, a general store run by the High Elves Karinnarre and Suurootan. Horses are kept at the Wildeye Stables outside the gate."

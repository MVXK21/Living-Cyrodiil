[[entry]]
id = "bruma-overview"
text = "Bruma is a cold mountain city in the Jerall Mountains of northern Cyrodiil, near the border with Skyrim, at the end of the Silver Road north of the Imperial City; the Orange Road runs southwest to Chorrol. It's snowbound much of the year, built in the Nordic style, and many of its people are Nords."
keywords = ["bruma", "city", "town", "jerall", "mountains", "skyrim", "nord", "nords", "snow", "cold", "silver road", "orange road", "north"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "bruma-local-summary"
text = "You live in Bruma, high in the snowy Jerall Mountains, a hardy town of Nords and Imperials built of stone and timber against the cold. The Great Chapel of Talos stands at its heart and Castle Bruma, seat of Countess Narina Carvain, at its north end."
keywords = ["bruma", "city", "town", "here", "news", "snow", "cold", "mountains"]
known_by = "locals:Bruma"
depth = "common"
always = true

[[entry]]
id = "bruma-ruler"
text = "Countess Narina Carvain rules Bruma from Castle Bruma. She is a Nibenese noblewoman, cool and proud, and not much loved by the town's Nords, though few doubt she cares for the city. Captain Burd commands the city guard."
keywords = ["countess", "count", "ruler", "rules", "narina", "carvain", "castle", "court", "captain", "burd", "guard", "guards"]
known_by = "locals:Bruma"
depth = "common"


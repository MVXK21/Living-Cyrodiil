[[entry]]
id = "bruma-inns"
text = "Bruma has two inns: the Jerall View Inn, kept by the Nord Hafid Hollowleg, and Olav's Tap and Tack, a Nord's alehouse and stable-inn run by Olav, where the locals drink."

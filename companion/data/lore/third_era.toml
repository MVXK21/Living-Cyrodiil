[[entry]]
id = "3e-uriel-v-akavir"
text = "Uriel V, crowned in 3E 268, made the Empire feared again with a run of conquests across the islands toward Akavir, then sailed the greatest fleet ever assembled to invade Akavir itself. He was killed at the battle of Ionith in 3E 290, and his five-year-old son became Uriel VI."
keywords = ["uriel v", "akavir", "ionith", "tsaesci", "fleet", "invasion", "conquest", "uriel vi", "history", "emperor"]
known_by = "everyone"
depth = "specialist"
area = "history"

[[entry]]
id = "3e-uriel-vi-to-pelagius-iv"
text = "Uriel VI won back real power from the Elder Council and died after a fall from his horse in 3E 320. His sister Morihatha then ruled until assassins killed her in 3E 339, and her nephew Pelagius IV reigned until 3E 368, leaving Tamriel more united than it had been in centuries."
keywords = ["uriel vi", "morihatha", "pelagius iv", "empress", "emperor", "history", "assassinated"]
known_by = "everyone"
depth = "scholar"
area = "history"

[[entry]]
id = "3e-uriel-vii"
text = "Uriel Septim VII was born in 3E 346 and crowned in 3E 368, and for decades worked to bind the provinces closer together. His sons were Geldall, born 3E 377, Enman, born 3E 378, and Ebel, born 3E 380."

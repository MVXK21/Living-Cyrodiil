[[entry]]
id = "3e-imperial-simulacrum"
text = "In 3E 389 the Imperial Battlemage Jagar Tharn betrayed Uriel Septim VII, imprisoned him in another dimension and ruled in his place wearing his face, a time called the Imperial Simulacrum. A hero killed Tharn and freed the Emperor in 3E 399, the event called the Restoration."

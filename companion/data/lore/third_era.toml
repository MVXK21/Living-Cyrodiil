# The Third Era, 3E 0 to 3E 432 (the knowledge cutoff; 3E 433 is quest-gated).
# Adapted from UESP (https://en.uesp.net), CC BY-SA 2.5. Page: Lore:Third Era
# (fetched Nov 4, 2026). Condensed to what people in Cyrodiil might know.
# Left out: quest spoilers (such as who leads the Mythic Dawn), events that are
# only of interest far from Cyrodiil, and everything from 3E 433 on.

[[entry]]
id = "3e-founding"
text = "Tiber Septim united all of Tamriel and proclaimed the Third Era. He ruled for 38 years, died in 3E 38, and is worshipped today as Talos, one of the Nine Divines. Every emperor since has been of his Septim line."
keywords = ["tiber", "septim", "talos", "third era", "empire", "founded", "unification", "united", "history", "emperor", "emperors"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "3e-early-emperors"
text = "After Tiber Septim came Pelagius I, murdered by the Dark Brotherhood in 3E 41, then Kintyra I, Uriel I, Uriel II, whose reign was full of plague and revolt, Pelagius II, and Antiochus, a debauched emperor whose rule saw civil wars and the War of the Isle against the sea elves of Pyandonea around 3E 110."
keywords = ["pelagius", "kintyra", "uriel", "antiochus", "emperor", "emperors", "history", "war of the isle", "pyandonea", "maormer", "psijic"]
known_by = "everyone"
depth = "scholar"
area = "history"

[[entry]]
id = "3e-red-diamond"
text = "The War of the Red Diamond (from 3E 121) was a war of succession among the Septims: Potema, the Wolf Queen of Solitude, put her son on the throne as Uriel III, while her brothers Cephorus and Magnus fought her. Uriel III was taken at Ichidag and burned alive by a mob in 3E 127, Cephorus I became emperor, and Potema died in the siege of Solitude in 3E 137."
keywords = ["red diamond", "potema", "wolf queen", "solitude", "uriel iii", "cephorus", "magnus", "war", "succession", "history"]
known_by = "everyone"
depth = "specialist"
area = "history"

[[entry]]
id = "3e-knights-of-the-nine"
text = "The Knights of the Nine were founded in 3E 111 by Sir Amiel Lannus to recover the lost relics of Pelinal Whitestrake, and the order was dissolved in 3E 131, never having recovered after the War of the Red Diamond."
keywords = ["knights of the nine", "amiel", "lannus", "pelinal", "crusader", "relics", "order", "knight", "knights"]
known_by = "everyone"
depth = "scholar"
area = "history"

[[entry]]
id = "3e-mad-pelagius-katariah"
text = "Pelagius III, called Pelagius the Mad, took the throne in 3E 145 and died in an asylum on the Isle of Betony in 3E 153. His widow Katariah, a Dunmer, then ruled for forty-six years, one of the most glorious reigns in the Empire's history."
keywords = ["pelagius", "mad", "katariah", "empress", "betony", "asylum", "dunmer", "history"]
known_by = "everyone"
depth = "specialist"
area = "history"

[[entry]]
id = "3e-elder-council"
text = "Since the days of Empress Katariah the Elder Council has held great power in the Empire, and under weak emperors it often held the real power. Uriel IV, Cephorus II and the young Uriel VI all struggled with it."
keywords = ["elder council", "council", "power", "uriel iv", "cephorus", "history", "government", "politics"]
known_by = "everyone"
depth = "specialist"
area = "history"

[[entry]]
id = "3e-camoran-usurper"
text = "Around 3E 249 the Camoran Usurper led armies of daedra and undead through Valenwood and into Hammerfell. He was finally defeated in 3E 267 at the Battle of Firewaves on the Iliac Bay, by Baron Othrok of Dwynnen and his allies."

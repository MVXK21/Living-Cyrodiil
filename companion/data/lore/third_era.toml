known_by = "everyone"
depth = "common"

[[entry]]
id = "3e-regional-wars"
text = "During the years of the Simulacrum, regional wars broke out across Tamriel: the Five Year War between Valenwood and Elsweyr (about 3E 395 to 399), the Arnesian War in Morrowind (3E 396), and in High Rock the War of Betony between Daggerfall and Sentinel (3E 402 to 403)."
keywords = ["five year war", "arnesian", "betony", "war", "wars", "valenwood", "elsweyr", "daggerfall", "sentinel", "history"]

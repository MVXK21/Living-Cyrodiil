[[entry]]
id = "skingrad-inns"
text = "Skingrad has two inns: the Two Sisters Lodge, run by the Orc Mog gra-Mogakh, and the West Weald Inn, kept by Erina Jeranus, where a High Elf alchemist named Sinderion lodges and works in the cellar."

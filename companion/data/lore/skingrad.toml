[[entry]]
id = "skingrad-overview"
text = "Skingrad is a Colovian city in the West Weald of southwestern Cyrodiil, on the Gold Road between the Imperial City and Kvatch. It's famous for its wines, above all the Surilie Brothers' vintages and Tamika's, grown in the vineyards around it, and for its tomatoes and cheese."
keywords = ["skingrad", "city", "town", "west weald", "gold road", "wine", "wines", "vineyard", "vineyards", "surilie", "tamika", "tomato", "tomatoes", "cheese"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "skingrad-local-summary"
text = "You live in Skingrad, split into a northern district of shops and guild halls and a southern one of homes and the Great Chapel of Julianos, joined by two bridges. Castle Skingrad stands outside the walls on a hill above the city, and the vineyards around it make the best wine in Cyrodiil."
keywords = ["skingrad", "city", "town", "here", "district", "districts", "bridge", "bridges", "news", "wine"]
known_by = "locals:Skingrad"
depth = "common"
always = true

[[entry]]
id = "skingrad-ruler"
text = "Count Janus Hassildor rules Skingrad from his castle on the hill, but he is a recluse and a wizard who is almost never seen, even by his own people; his Argonian steward, Hal-Liurz, speaks for him; she sees to the county's business. People whisper all kinds of things about him, but he keeps the city well run."
keywords = ["count", "ruler", "rules", "janus", "hassildor", "castle", "recluse", "wizard", "steward", "hal-liurz", "court"]
known_by = "locals:Skingrad"
depth = "common"

[[entry]]

[[entry]]
id = "skingrad-wine"
text = "Skingrad's wine is the pride of the West Weald. The Surilie Brothers, Davide and Gaston, and the vintner Tamika have their vineyards just outside the city, and a good year's bottle fetches a fine price in the Imperial City."
keywords = ["wine", "wines", "vintage", "vineyard", "vineyards", "surilie", "davide", "gaston", "tamika", "grapes", "drink"]
known_by = "locals:Skingrad"

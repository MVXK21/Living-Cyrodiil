[[entry]]
id = "skingrad-shops"
text = "For trade in Skingrad: Colovian Traders, Gunder's general store; Hammer and Tongs, where Agnete the Pickled sells and repairs arms and armour; and All Things Alchemical, the Dunmer Falanu Hlaalu's shop. Horses are kept at the Grateful Pass Stables by the west gate."
keywords = ["shop", "shops", "store", "buy", "sell", "trade", "goods", "smith", "blacksmith", "weapon", "weapons", "armor", "armour", "repair", "alchemy", "alchemist", "potion", "potions", "horse", "horses", "stables", "colovian traders", "gunder", "hammer and tongs", "agnete", "falanu", "grateful pass"]
known_by = "locals:Skingrad"
depth = "common"

[[entry]]
id = "skingrad-guilds"
text = "Skingrad has halls of both guilds in its northern district: the Mages Guild, led by Adrienne Berene, and the Fighters Guild. The Great Chapel of Julianos, god of wisdom and law, stands in the southern district."

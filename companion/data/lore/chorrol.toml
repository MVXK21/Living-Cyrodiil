[[entry]]
id = "chorrol-overview"
text = "Chorrol is a Colovian city in the Great Forest of northwestern Cyrodiil, on the Black Road west of the Imperial City, with the Orange Road running northeast to Bruma. The Colovian Highlands and the Hammerfell border lie beyond it. A great oak stands in its central plaza, and the Fighters Guild has its head hall there."
keywords = ["chorrol", "city", "town", "great forest", "black road", "orange road", "colovian", "highlands", "oak", "great oak"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "chorrol-local-summary"
text = "You live in Chorrol, a quiet, prosperous Colovian city around the Great Oak in its central plaza. The Chapel of Stendarr stands to one side and Castle Chorrol, where Countess Arriana Valga holds court, to the other; the Fighters Guild's head hall is here, and Weynon Priory lies just outside the walls."
keywords = ["chorrol", "city", "town", "here", "news", "oak", "plaza"]
known_by = "locals:Chorrol"
depth = "common"
always = true

[[entry]]
id = "chorrol-ruler"
text = "Countess Arriana Valga rules Chorrol from Castle Chorrol. She is a widow, her husband having died in battle, and she's well liked; her daughter Alessia recently married Count Marius Caro of Leyawiin. Her steward is the Imperial Laythe Wavrick."
keywords = ["countess", "count", "ruler", "rules", "arriana", "valga", "castle", "court", "widow", "alessia", "steward", "laythe"]
known_by = "locals:Chorrol"
depth = "common"


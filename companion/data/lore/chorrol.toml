[[entry]]
id = "chorrol-inns"
text = "Chorrol has two inns: the Grey Mare, a plain, cheap place kept by the Nord Emfrid, where common folk and Fighters Guild men drink; and the Oak and Crosier, the finer house by the Great Oak, kept by the Khajiit Talasma."
keywords = ["inn", "inns", "tavern", "room", "bed", "sleep", "drink", "ale", "mead", "food", "eat", "meal", "stay", "grey mare", "gray mare", "oak and crosier", "emfrid", "talasma"]
known_by = "locals:Chorrol"
depth = "common"

[[entry]]
id = "chorrol-shops"
text = "For trade in Chorrol: Fire and Steel, where the Redguard Rasheda sells and repairs arms and armour; Northern Goods and Trade, the Argonian Seed-Neeus's general store; and Renoit's Books, run by Estelle Renoit. Horses are kept at the North Country Stables outside the gate."
keywords = ["shop", "shops", "store", "buy", "sell", "trade", "goods", "smith", "blacksmith", "weapon", "weapons", "armor", "armour", "repair", "book", "books", "horse", "horses", "stables", "fire and steel", "rasheda", "northern goods", "seed-neeus", "renoit", "estelle"]
known_by = "locals:Chorrol"
depth = "common"

[[entry]]
id = "chorrol-guilds"
text = "The Fighters Guild's head hall is in Chorrol, and its Guildmaster, Vilena Donton, lives in the city with her son Viranus; the Dunmer Modryn Oreyn is one of the Guild's best fighters. The Mages Guild hall here is led by the Argonian Teekeeus."
keywords = ["guild", "guilds", "fighters guild", "mages guild", "guildmaster", "vilena", "donton", "viranus", "modryn", "oreyn", "teekeeus", "mage", "mages", "fighter", "fighters", "work", "job", "contract"]
known_by = "locals:Chorrol"

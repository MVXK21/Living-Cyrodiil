[[entry]]
id = "chorrol-chapel"
text = "The Chapel of Stendarr in Chorrol is the city's great temple, devoted to Stendarr, god of mercy. Its priests heal and bless, and Brother Kellen is among them."
keywords = ["chapel", "temple", "stendarr", "priest", "priests", "heal", "healing", "blessing", "pray", "worship", "kellen"]
known_by = "locals:Chorrol"
depth = "common"

[[entry]]
id = "chorrol-surroundings"
text = "Outside Chorrol lie Weynon Priory, a quiet house of monks of Akatosh just east of the city; the Odiil farm to the north; and, a little way south, the backward village of Hackdirt, whose folk keep to themselves and don't welcome strangers."
keywords = ["weynon", "priory", "monk", "monks", "odiil", "farm", "hackdirt", "village", "outside", "nearby", "near", "around"]
known_by = "locals:Chorrol"
depth = "common"

[[entry]]
id = "chorrol-history"
text = "Chorrol is one of the old Colovian cities of western Cyrodiil, a place of forests, hunting and steady trade with Hammerfell and High Rock. Its people are proud, plain-spoken Colovians, more practical than the Nibenese of the east."
keywords = ["history", "old", "colovian", "colovians", "hammerfell", "high rock", "west", "nibenese"]
known_by = "locals:Chorrol"
depth = "specialist"
area = "history"

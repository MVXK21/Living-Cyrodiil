[[entry]]
id = "arena-faction"
text = "Any fighter can join the Arena in the Imperial City as a gladiator, starting at the bottom rank and fighting their way up through matches toward the title of Grand Champion."
keywords = ["arena", "join", "gladiator", "gladiators", "match", "matches", "fight", "rank", "grand champion"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "thieves-guild-rumour"
text = "Everyone has heard of the Thieves Guild, though the Watch says there's no such thing. People say its members live among the beggars, steal only from those who can afford it, and never kill, and that the Gray Fox leads them."
keywords = ["thieves guild", "thief", "thieves", "steal", "stealing", "theft", "gray fox", "grey fox", "beggar", "beggars", "fence"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "dark-brotherhood-rumour"
text = "The Dark Brotherhood is a guild of assassins that kills for pay. Folk say that if you perform the Black Sacrament, a dark ritual calling on the Night Mother, they will come to take the contract, and that they recruit murderers by visiting them in their sleep."
keywords = ["dark brotherhood", "assassin", "assassins", "murder", "murderer", "contract", "kill", "black sacrament", "night mother", "sithis"]
known_by = "everyone"
depth = "common"

# ---- gods and Daedra -----------------------------------------------------------

[[entry]]
id = "nine-divines"
text = "The Nine Divines are the gods of the Empire: Akatosh, the dragon god of time and chief of the Nine; Arkay, god of life and death; Dibella, goddess of beauty and love; Julianos, god of wisdom and law; Kynareth, goddess of the sky and nature; Mara, goddess of love and mercy; Stendarr, god of mercy and justice; Zenithar, god of work and trade; and Talos, Tiber Septim made a god."
keywords = ["nine", "divines", "gods", "god", "goddess", "pray", "prayer", "worship", "akatosh", "arkay", "dibella", "julianos", "kynareth", "mara", "stendarr", "zenithar", "talos", "religion", "faith"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "nine-divines-chapels"
text = "Each city has a great chapel to one of the Nine: Akatosh in Kvatch, Arkay in Cheydinhal, Dibella in Anvil, Julianos in Skingrad, Mara in Bravil, Stendarr in Chorrol, Talos in Bruma and Zenithar in Leyawiin, with the Temple of the One in the Imperial City for all of them. Their priests heal, bless and bury the dead, and the wayshrines of the Nine along the roads bless travellers."
keywords = ["chapel", "chapels", "temple", "temples", "priest", "priests", "heal", "healing", "bless", "blessing", "wayshrine", "wayshrines", "shrine", "shrines"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "daedra"
text = "The Daedra are the spirits of Oblivion, and the most powerful, the Daedric Princes, such as Mehrunes Dagon, Molag Bal, Sanguine and Sheogorath, are worshipped only by fools, cultists and the desperate. Decent folk keep away from their shrines in the wilds."
keywords = ["daedra", "daedric", "prince", "princes", "oblivion", "dagon", "mehrunes", "molag bal", "sanguine", "sheogorath", "azura", "hircine", "namira", "vaermina", "clavicus", "boethiah", "malacath", "mephala", "meridia", "peryite", "hermaeus", "nocturnal", "shrine", "shrines", "cult", "cultist", "cultists"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "daedra-scholar"
text = "Scholars count sixteen Daedric Princes, each ruling a realm of Oblivion: among them Mehrunes Dagon, Prince of Destruction; Molag Bal, of domination; Azura, of dusk and dawn; Boethiah, of plots; Hircine, of the hunt; Sheogorath, of madness; and Hermaeus Mora, of forbidden knowledge. Each has a shrine somewhere in Cyrodiil where its followers gather on its summoning day."
keywords = ["daedric princes", "princes", "sixteen", "realm", "realms", "oblivion", "dagon", "molag bal", "azura", "boethiah", "hircine", "sheogorath", "hermaeus mora", "shrine", "summoning", "artifact", "artifacts"]
known_by = "everyone"
depth = "scholar"
area = "magic"

# ---- the provinces and their peoples -----------------------------------------

[[entry]]
id = "tamriel-provinces"
text = "The Empire holds all nine provinces of Tamriel: Cyrodiil at its heart, Skyrim of the Nords to the north, Morrowind of the Dunmer to the east, Black Marsh of the Argonians and Elsweyr of the Khajiit to the south, Valenwood of the Bosmer and the Summerset Isles of the Altmer to the southwest, and Hammerfell of the Redguards and High Rock of the Bretons and Orcs to the west."
keywords = ["tamriel", "province", "provinces", "empire", "skyrim", "morrowind", "black marsh", "elsweyr", "valenwood", "summerset", "hammerfell", "high rock", "world", "lands", "country", "countries"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "races-of-tamriel"
text = "Cyrodiil's people come from every province: Imperials, the native folk; Nords, big and hardy; Redguards, fierce warriors; Bretons, with a gift for magic; Dunmer or Dark Elves, proud and grim; Altmer or High Elves, haughty and learned; Bosmer or Wood Elves, quick archers; Orcs, strong smiths and soldiers; Argonians, lizard-folk of the marshes; and Khajiit, cat-folk of Elsweyr."
keywords = ["race", "races", "people", "folk", "imperial", "imperials", "nord", "nords", "redguard", "redguards", "breton", "bretons", "dunmer", "dark elf", "altmer", "high elf", "bosmer", "wood elf", "orc", "orcs", "orsimer", "argonian", "argonians", "khajiit", "elf", "elves"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "ayleids"
text = "The Ayleids, the old wild elves, ruled Cyrodiil before humans did and built the white stone ruins that still stand in the wilds, many of them full of traps, undead and treasure. Saint Alessia overthrew them in the First Era with the help of the gods."
keywords = ["ayleid", "ayleids", "elves", "ruin", "ruins", "white", "welkynd", "varla", "ancient", "alessia", "first era"]
known_by = "everyone"
depth = "common"

# ---- creatures and dangers -------------------------------------------------------

[[entry]]
id = "creatures-common"
text = "Out in the wilds there are wolves, bears, boars and mountain lions; mudcrabs on the shores and slaughterfish in the water; goblins in the caves, who raid farms; and trolls, ogres and minotaurs in the remoter places. Will-o-the-wisps glow in the dark of old ruins and woods."
keywords = ["creature", "creatures", "animal", "animals", "beast", "beasts", "monster", "monsters", "wolf", "wolves", "bear", "bears", "boar", "lion", "mudcrab", "mudcrabs", "slaughterfish", "goblin", "goblins", "troll", "trolls", "ogre", "ogres", "minotaur", "minotaurs", "wisp", "wisps", "hunt", "hunting"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "undead-and-necromancers"
text = "Ancient tombs and ruins are haunted by skeletons, zombies, ghosts and wraiths. Necromancers raise the dead for their own ends, and since the Mages Guild banned necromancy they've been hiding out in caves and forts."
keywords = ["undead", "skeleton", "skeletons", "zombie", "zombies", "ghost", "ghosts", "wraith", "wraiths", "lich", "necromancer", "necromancers", "necromancy", "tomb", "tombs", "crypt", "crypts"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "vampires"
text = "Vampires are real enough, people say: they hide in caves and old ruins and feed on the living, and someone bitten can catch the vampire's disease, Porphyric Hemophilia, and turn into one in a few days unless a priest cures it in time."
keywords = ["vampire", "vampires", "vampirism", "bite", "bitten", "blood", "porphyric", "hemophilia", "disease", "cure"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "diseases"
text = "Rats, wolves and other beasts carry diseases such as Collywobbles, Rockjoint and Brain Fever; a priest's blessing at any chapel or wayshrine, or a cure-disease potion, will clear them."
keywords = ["disease", "diseases", "sick", "sickness", "ill", "illness", "cure", "collywobbles", "rockjoint", "brain fever", "plague", "potion"]
known_by = "everyone"
depth = "common"

# ---- guilds and institutions -------------------------------------------------

[[entry]]
id = "fighters-guild"
until = "FGD09Hist:completed"
text = "The Fighters Guild hires out its members as guards, monster-slayers and escorts, with a hall in every city and its head hall in Chorrol under Guildmaster Vilena Donton. Lately it has been losing contracts to the cheaper Blackwood Company of Leyawiin."
keywords = ["fighters guild", "fighter", "fighters", "guild", "mercenary", "mercenaries", "contract", "contracts", "hire", "vilena", "donton", "work", "join"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "fighters-guild-members"
text = "In the Fighters Guild, a new member takes contracts from their hall's head, earns rank by doing them honestly, and is expected never to steal or kill outside a contract; the Guildmaster in Chorrol hands out the most important work. Members are glad of the work but worried about the Blackwood Company stealing it."
keywords = ["fighters guild", "guild", "rank", "contract", "contracts", "rules", "guildmaster", "promotion", "member", "members", "blackwood"]
known_by = "faction:Fighters Guild"
depth = "common"

[[entry]]
id = "mages-guild"
until = "MG18KingofWorms:completed"
text = "The Mages Guild trains and sells magic, with a hall in every city and its seat at the Arcane University in the Imperial City, under Arch-Mage Hannibal Traven. Anyone may join a local hall, but only those recommended by every hall may enter the University. Traven has banned necromancy from the Guild, which not every mage liked."
keywords = ["mages guild", "mage", "mages", "guild", "magic", "arcane university", "traven", "arch-mage", "archmage", "necromancy", "necromancer", "necromancers", "join", "recommendation"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "mages-guild-members"
text = "A new member of the Mages Guild must earn a recommendation from the head of every one of the seven city halls before they may enter the Arcane University, where they can make spells and enchant items. The Council of Mages governs the Guild under the Arch-Mage, and the ban on necromancy is taken very seriously."
keywords = ["mages guild", "guild", "recommendation", "recommendations", "hall", "halls", "arcane university", "council", "council of mages", "rank", "necromancy", "member", "members", "join"]
known_by = "faction:Mages Guild"
depth = "common"

[[entry]]
id = "imperial-legion"
text = "The Imperial Legion is the Empire's army. In Cyrodiil it patrols the roads and garrisons the forts; each city's own guard keeps the peace inside its walls, and the Imperial Watch guards the capital."
keywords = ["legion", "imperial legion", "army", "soldier", "soldiers", "patrol", "patrols", "guard", "guards", "watch", "fort", "forts"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "blades"
text = "The Blades are the Emperor's own bodyguards and agents, warriors in Akaviri armour sworn to protect the Dragonborn emperors."
keywords = ["blades", "blade", "bodyguard", "bodyguards", "akaviri", "emperor", "guard", "dragonborn"]
known_by = "everyone"
depth = "common"

# The Oblivion Crisis of the default story (crisis = true): left out when the

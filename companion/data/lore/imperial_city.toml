depth = "common"

[[entry]]
id = "ic-market-magic"
text = "Magic in the Market District: the Mystic Emporium, run by the High Elves Aurelinwae and Calindil; Edgar's Discount Spells, kept by Edgar Vautrine; and Rindir's Staffs. The Arcane University on City Isle sells spells as well, but only to the Mages Guild."

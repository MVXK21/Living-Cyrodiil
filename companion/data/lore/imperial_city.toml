# The Imperial City, as it stands in 3E 433 at the start of the game.
# Adapted from UESP (https://en.uesp.net), CC BY-SA 2.5. Pages:
# Oblivion:Imperial City, Lore:Imperial City, Oblivion:Imperial City People,
# Oblivion:Market District, Oblivion:Elven Gardens District,
# Oblivion:Talos Plaza District, Oblivion:Temple District, Oblivion:Arena District,
# Oblivion:Arboretum, Oblivion:Waterfront District, Oblivion:Green Emperor Way,
# Oblivion:Imperial Palace, Oblivion:Arcane University, Oblivion:Imperial City Prison,
# Oblivion:Inns (fetched Nov 10, 2026).
# Left out: quest spoilers, secret identities (fences, Thieves Guild and Dark
# Brotherhood members, the Mythic Dawn), Fourth Era events, and 3E 433 events
# that quests unlock.
# Locals are matched by the NPC's location: "Imperial City" covers the whole
# city, and each district's name covers that district.

# ---- the city as a whole ---------------------------------------------------

[[entry]]
id = "ic-overview"
text = "The Imperial City is the capital of Cyrodiil and of the whole Empire. It stands on City Isle in Lake Rumare, in the Heartlands at the centre of the province, a great ring of walls around White-Gold Tower and the Imperial Palace, with the Talos Bridge linking it to the mainland near the village of Weye."
keywords = ["imperial city", "capital", "city isle", "lake rumare", "white-gold", "white gold", "tower", "heartlands", "talos bridge", "weye"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "ic-local-summary"
text = "You live in the Imperial City. Around Green Emperor Way and the Palace lie six walled districts: the Market District, the Elven Gardens, Talos Plaza, the Temple District, the Arena District and the Arboretum; outside the inner walls are the Waterfront with its harbour, the Arcane University and the Imperial Prison. The Imperial Watch keeps order."
keywords = ["imperial city", "city", "here", "district", "districts", "news", "watch", "guard"]
known_by = "locals:Imperial City"
depth = "common"
always = true

# The Oblivion Crisis of the default story (crisis = true): left out when the
# player's world knowledge replaces the world facts.
[[entry]]
id = "ic-emperor-murder"
text = "Everyone in the city is still shaken by the Emperor's murder. Since then High Chancellor Ocato and the Elder Council govern from the Palace, and the throne stands empty."
keywords = ["emperor", "murder", "throne", "news", "council", "ocato"]
known_by = "locals:Imperial City"
depth = "common"
always = true
crisis = true

[[entry]]
id = "ic-districts"
text = "The Imperial City's districts each have their own character: the Market District for shops, the Elven Gardens for ordinary homes and taverns, Talos Plaza for the wealthy, the Temple District around the Temple of the One, the Arena District for the games, and the Arboretum, the city's park. The Waterfront, outside the walls by the docks, is the poorest part of the city."
keywords = ["district", "districts", "market", "elven gardens", "talos plaza", "temple district", "arena district", "arboretum", "waterfront", "where", "neighbourhood", "quarter", "rich", "poor"]
known_by = "locals:Imperial City"
depth = "common"

[[entry]]
id = "ic-inns"
text = "Inns in the Imperial City: the Merchants Inn in the Market District, kept by Velus Hosidius; the King and Queen Tavern and Luther Broad's Boarding House in the Elven Gardens; in Talos Plaza, the Tiber Septim Hotel, the finest and dearest in the city, and a separate tavern, the Foaming Flask, run by Ernest Manis; the All-Saints Inn in the Temple District, kept by Willet; and the Bloated Float, an inn on an old ship moored at the Waterfront."
keywords = ["inn", "inns", "tavern", "taverns", "room", "bed", "sleep", "drink", "ale", "mead", "wine", "food", "eat", "meal", "stay", "merchants inn", "king and queen", "luther broad", "boarding house", "tiber septim hotel", "foaming flask", "all-saints", "bloated float"]
known_by = "locals:Imperial City"
depth = "common"

[[entry]]
id = "ic-watch"
until = "TG07Lex:completed"
text = "The Imperial Watch guards the Imperial City. Captain Hieronymus Lex is the best known of its officers, stern and set on catching the Gray Fox, and he keeps a hard eye on the Waterfront. The guards sleep in the watch towers at the six corners of the city."
keywords = ["watch", "guard", "guards", "legion", "captain", "lex", "hieronymus", "law", "crime", "arrest", "tower", "towers", "gray fox", "grey fox"]
known_by = "locals:Imperial City"
depth = "common"

[[entry]]
id = "ic-gray-fox"
text = "The Gray Fox is a master thief the Watch has never caught, said to steal from the rich and the proud and never to kill. Some say he's been at it for a hundred years, which can't be true, and some folk at the Waterfront speak of him almost fondly."
keywords = ["gray fox", "grey fox", "thief", "thieves", "stolen", "theft", "steal", "thieves guild"]
known_by = "locals:Imperial City"
depth = "common"

[[entry]]
id = "ic-black-horse-courier"
text = "The Black Horse Courier, the Empire's newssheet, is printed in the Imperial City's Market District, and people read the latest copy for news of the city and the provinces."

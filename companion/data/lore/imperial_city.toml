[[entry]]
id = "ic-history"
text = "White-Gold Tower was raised by the Ayleids, the old elves who ruled Cyrodiil before men did. Saint Alessia took it when she freed humankind from them in the First Era, and since Tiber Septim founded the Third Empire the Imperial City has been the seat of the Emperors."
keywords = ["history", "old", "ancient", "ayleid", "ayleids", "elves", "alessia", "tiber septim", "founded", "built", "white-gold", "white gold", "tower"]
known_by = "everyone"
depth = "specialist"
area = "history"

[[entry]]
id = "ic-dragonfires"
text = "The Temple of the One holds the Dragonfires, which every new Emperor of the Septim blood must light to take the throne, and which keep the Empire safe from Daedric invasion. That tradition goes back to Saint Alessia's covenant with Akatosh."
keywords = ["dragonfire", "dragonfires", "temple of the one", "covenant", "alessia", "akatosh", "throne", "crown", "emperor", "amulet"]
known_by = "everyone"
depth = "specialist"
area = "history"

# ---- the districts -----------------------------------------------------------

[[entry]]
id = "ic-market-local"
text = "You're in the Market District, on the northeastern side of the Imperial City, where most of the city's shops are, from smiths and alchemists to clothiers, jewellers and booksellers. The Merchants Inn, the Feed Bag and the Black Horse Courier's office are here too."
keywords = ["market", "market district", "here", "shop", "shops"]
known_by = "locals:Market District"
depth = "common"
always = true

[[entry]]
id = "ic-market-smiths"
text = "For arms and armour in the Market District: A Fighting Chance, run by the Redguard Rohssan; Slash 'N Smash, the Orc Urbul gro-Orkulg's shop; Stonewall Shields, kept by Viator Accius; and The Best Defense, run by Maro Rufus and Varnado. They all do repairs."
keywords = ["smith", "smiths", "blacksmith", "weapon", "weapons", "sword", "armor", "armour", "shield", "shields", "repair", "repairs", "fighting chance", "slash", "stonewall", "best defense", "rohssan", "urbul", "viator", "varnado", "maro"]

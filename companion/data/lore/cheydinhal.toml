[[entry]]
id = "cheydinhal-overview"
text = "Cheydinhal is a city in the Nibenay Basin of northeastern Cyrodiil, in the foothills of the Valus Mountains at the eastern end of the Blue Road, near the Morrowind border. Many Dunmer live there, and its buildings show their style."
keywords = ["cheydinhal", "city", "town", "nibenay", "valus", "mountains", "blue road", "morrowind", "dunmer", "dark elf", "dark elves", "east"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "cheydinhal-local-summary"
text = "You live in Cheydinhal, a pleasant city of red roofs split by a little river: the western side has the shops, guild halls and Cheydinhal Castle, the eastern side the homes and the Great Chapel of Arkay, with bridges between. Count Andel Indarys, a Dunmer, rules here."
keywords = ["cheydinhal", "city", "town", "here", "news", "river", "bridge", "bridges"]
known_by = "locals:Cheydinhal"
depth = "common"
always = true

[[entry]]
id = "cheydinhal-ruler"
text = "Count Andel Indarys rules Cheydinhal from its castle, a Dunmer once of House Hlaalu in Morrowind and the only ruler of a Cyrodiil county who isn't an Imperial, given the county for his service to the Empire. His son Farwil leads a band of young men who call themselves the Knights of the Thorn, more for show than anything."
keywords = ["count", "ruler", "rules", "andel", "indarys", "castle", "court", "hlaalu", "dunmer", "farwil", "son", "knights of the thorn"]
known_by = "locals:Cheydinhal"
depth = "common"

[[entry]]
id = "cheydinhal-ruler-public"

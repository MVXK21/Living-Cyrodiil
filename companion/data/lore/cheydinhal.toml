[[entry]]
id = "cheydinhal-inns"
text = "Cheydinhal has two inns: the Cheydinhal Bridge Inn, kept by Mariana Ancharia, and Newlands Lodge, run by the Dunmer Dervera Romalen, who isn't fond of her fellow Dark Elves."
keywords = ["inn", "inns", "tavern", "room", "bed", "sleep", "drink", "ale", "food", "eat", "meal", "stay", "bridge inn", "newlands", "mariana", "dervera"]
known_by = "locals:Cheydinhal"
depth = "common"

[[entry]]
id = "cheydinhal-shops"
text = "For trade in Cheydinhal: Borba's Goods and Stores, the Orc Borba gra-Uzgash's general store; the March Rider, where Tertia Viducia sells and repairs arms and armour; and Mach-Na's Books, run by an Argonian. Horses are kept at the Black Waterside Stables outside the gate."
keywords = ["shop", "shops", "store", "buy", "sell", "trade", "goods", "smith", "blacksmith", "weapon", "weapons", "armor", "armour", "repair", "book", "books", "horse", "horses", "stables", "borba", "march rider", "tertia", "mach-na", "black waterside"]
known_by = "locals:Cheydinhal"
depth = "common"

[[entry]]
id = "cheydinhal-guilds"
text = "Cheydinhal has halls of the Fighters Guild and the Mages Guild; the Mages Guild hall is led by Falcar, a stern, unfriendly Altmer, with the Argonian Deetsan doing most of the real work. The Great Chapel of Arkay, god of life and death, is the city's temple."
keywords = ["guild", "guilds", "fighters guild", "mages guild", "falcar", "deetsan", "mage", "mages", "chapel", "temple", "arkay", "priest", "heal", "healing", "pray"]
known_by = "locals:Cheydinhal"
depth = "common"

[[entry]]
id = "cheydinhal-riverview"
text = "Riverview, a big house in Cheydinhal, is known for the lavish parties held there every week."

[[entry]]
id = "anvil-inns"
text = "Anvil has three taverns: the Count's Arms, the city's finest inn, kept by Wilbur; the Flowing Bowl, a rougher place run by Maenlorn; and the Fo'c's'le, a sailors' tavern down at the harbour."

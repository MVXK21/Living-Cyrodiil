[[entry]]
id = "anvil-guilds"
text = "Anvil has a Fighters Guild hall and a Mages Guild hall, the latter led by the High Elf Carahil, who has made it known for keeping the roads around Anvil safe. The Chapel of Dibella, goddess of beauty and love, is the city's temple."

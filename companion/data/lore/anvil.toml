# Anvil, as it stands in 3E 433 at the start of the game.
# Adapted from UESP (https://en.uesp.net), CC BY-SA 2.5. Pages:
# Oblivion:Anvil, Oblivion:Anvil People, Lore:Anvil (fetched Nov 10, 2026).
# Left out: what became of Count Corvus (a Thieves Guild secret), the women
# who rob men at the Flowing Bowl, the haunting's cause, Knights of the Nine,
# and the city's gate (3E 433, quest-gated).

[[entry]]
id = "anvil-overview"
text = "Anvil is a wealthy port city on the Gold Coast in far southwestern Cyrodiil, on the Abecean Sea at the western end of the Gold Road. Its harbour trades with Hammerfell and the Summerset Isles, and its white walls and buildings show the Redguards' influence."
keywords = ["anvil", "city", "town", "gold coast", "abecean", "sea", "port", "harbour", "harbor", "gold road", "redguard", "redguards", "hammerfell", "ships"]
known_by = "everyone"
depth = "common"

[[entry]]
id = "anvil-local-summary"
text = "You live in Anvil, a prosperous port on the Gold Coast. The city within the walls holds the shops, guild halls, homes and the Chapel of Dibella; the harbour lies outside the walls to the south, and Anvil Castle stands on its own island, home of Countess Millona Umbranox."
keywords = ["anvil", "city", "town", "here", "news", "harbour", "harbor", "docks"]
known_by = "locals:Anvil"
depth = "common"
always = true

[[entry]]
id = "anvil-ruler"
text = "Countess Millona Umbranox rules Anvil from Anvil Castle. Her husband, Count Corvus Umbranox, vanished years ago without a word, and she has governed alone ever since, still hoping he'll come back."
keywords = ["countess", "count", "ruler", "rules", "millona", "umbranox", "corvus", "castle", "court", "missing", "husband"]
known_by = "locals:Anvil"
depth = "common"


[[entry]]
id = "anvil-harbour"
text = "Anvil's harbour, outside the walls, has the Fo'c's'le tavern, the harborside warehouse and ships at the docks, among them the Sea Tub Clarabella. Sailors from all over the Abecean pass through, and folk say pirates aren't far off the coast."

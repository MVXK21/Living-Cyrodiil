[[entry]]
id = "anvil-shops"
text = "For trade in Anvil: Lelles' Quality Merchandise, Norbert Lelles's general store; and Morvayn's Peacemakers, where the Dunmer smith Varel Morvayn and his partner sell and repair arms and armour. Horses are kept at the Horse Whisperer Stables outside the walls."

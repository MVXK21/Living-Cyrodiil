; Living Cyrodiil plugin settings. Lives next to LivingCyrodiil.dll in OBSE\Plugins.
; Missing lines use the defaults shown here.

[Companion]
; Local port the companion program listens on. Must match [game] port in the
; companion's settings (settings.toml in Documents\My Games\Oblivion\LivingCyrodiil,
; or settings.local.toml in a development setup). Only change it if another
; program uses it.
Port=47833
; 1 = start the companion (it ships inside the mod) with the game, hidden, and
; close it with the game. 0 = start it yourself.
AutoStart=1

[Controls]
; Push-to-talk key: hold it while you speak. Default F4. Pick one your mods
; don't already use. Write the key's name (capitals and spaces don't matter):
;   Letters A-Z, numbers 0-9, F1-F12
;   LeftShift, RightShift, LeftCtrl, RightCtrl, LeftAlt, RightAlt, Space, Tab,
;   CapsLock, Enter, Backspace, Tilde, Minus, Equals, LeftBracket, RightBracket,
;   Semicolon, Apostrophe, Comma, Period, Slash, Backslash
;   Insert, Delete, Home, End, PageUp, PageDown, Up, Down, Left, Right
;   Numpad0-Numpad9, NumpadPlus, NumpadMinus, NumpadMultiply, NumpadDivide,
;   NumpadPeriod, NumpadEnter, NumLock, ScrollLock
;   Mouse3 (middle button), Mouse4 and Mouse5 (side buttons), Mouse6-Mouse8
; A scan code number (like 62 for F4) also works. If the name isn't
; recognised, F4 is used and you'll see a message when you load a save.
TalkKey=F4
; 1 = while you're in the game world, the game doesn't see the talk and type
; keys, so anything else bound to them won't fire. Menus and the console still get it.
; 0 = the key also does whatever else it's bound to.
BlockTalkKey=1
; Typing instead of speaking (being built): look at someone, press this key, type
; what you say, press Enter. Default F3. Same key names as TalkKey; Off = no typing.
TypeKey=F3

[General]
; 1 = show "Living Cyrodiil x.y.z is loaded." after loading a save. 0 = don't.
ShowGreeting=1
; 1 = show "companion connected/disconnected" notifications. 0 = don't.
ShowConnectionNotices=1
; 1 = NPCs know who they were just chatting with when you talk to them (the
; plugin notes which NPCs near you talk to each other). 0 = off.
ChatterAwareness=1

[Debug]
; 1 = log every voice file the game looks for in LivingCyrodiil.log (for
; diagnosing replies that don't show). 0 = off.
LogVoiceFiles=0
